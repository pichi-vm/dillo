name: Diagnostic Arm EL1 timer interrupts

on:
  push:
    branches: [diag/arm-timer-ppis]
  workflow_dispatch:

permissions:
  contents: read

env:
  NIGHTLY: nightly-2026-07-06
  CARGO_BUILD_RUSTFLAGS: -D warnings

jobs:
  native:
    if: github.ref == 'refs/heads/diag/arm-timer-ppis'
    name: Native ${{ matrix.backend }} timer probe
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - backend: kvm
            runners: '["self-hosted","Linux","ARM64","bare-metal","aarch64","kvm"]'
          - backend: hvf
            runners: '["self-hosted","macOS","ARM64","bare-metal","m1"]'
    runs-on: ${{ fromJSON(matrix.runners) }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Record exact source and native host
        shell: bash
        env:
          PROBE_BACKEND: ${{ matrix.backend }}
        run: |
          mkdir -p target/arm-timer-evidence
          {
            test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
            git rev-parse HEAD
            git status --short
            date -u +%FT%TZ
            uname -a
            if [[ "$PROBE_BACKEND" == kvm ]]; then
              test "$(uname -m)" = aarch64
              test -c /dev/kvm
              test -r /dev/kvm
              test -w /dev/kvm
              ls -l /dev/kvm
            else
              test "$(uname -m)" = arm64
              sw_vers
              sysctl -n machdep.cpu.brand_string
              test "$(sysctl -n kern.hv_support)" = 1
            fi
          } 2>&1 | tee target/arm-timer-evidence/host.log
      - name: Build only the focused native backend test binary
        shell: bash
        env:
          PROBE_CRATE: dillo-machine-${{ matrix.backend }}
        run: |
          rustup toolchain install "$NIGHTLY" --profile minimal
          rustc +"$NIGHTLY" -vV | tee target/arm-timer-evidence/rustc.log
          if ! cargo +"$NIGHTLY" --config .copr/cargo-config.toml test \
            --locked -p "$PROBE_CRATE" --lib --no-run --message-format=json \
            > target/arm-timer-evidence/build.jsonl \
            2> target/arm-timer-evidence/build.stderr; then
            cat target/arm-timer-evidence/build.stderr
            exit 1
          fi
      - name: Execute each exact probe with a process-group deadline
        shell: bash
        env:
          PROBE_BACKEND: ${{ matrix.backend }}
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json
          import os
          import signal
          import subprocess

          backend = os.environ["PROBE_BACKEND"]
          evidence = Path("target/arm-timer-evidence")
          build = [json.loads(line) for line in (evidence / "build.jsonl").read_text().splitlines()]
          binaries = [
              event["executable"]
              for event in build
              if event["reason"] == "compiler-artifact"
              and event["target"]["name"] == "dillo_machine_" + backend
              and event["profile"]["test"]
              and event["executable"]
          ]
          assert len(binaries) == 1, f"expected one linked native test binary, got {binaries}"
          binary, = binaries
          if backend == "kvm":
              cases = ["native_kvm_relocated_el1_timer_ppis"]
              deadline = 20
          else:
              cases = ["native_hvf_el1_physical_timer", "native_hvf_el1_virtual_timer"]
              deadline = 70

          def run(arguments, path, seconds):
              command = [binary, *arguments]
              print(f"deadline={seconds}s command={command!r}", flush=True)
              with path.open("wb") as log:
                  child = subprocess.Popen(
                      command, stdout=log, stderr=subprocess.STDOUT, start_new_session=True
                  )
                  try:
                      status = child.wait(timeout=seconds)
                  except subprocess.TimeoutExpired:
                      try:
                          os.killpg(child.pid, signal.SIGKILL)
                      except ProcessLookupError:
                          pass
                      killed = child.wait(timeout=5)
                      print(f"TIMEOUT; process group kill, wait status={killed}", flush=True)
                      status = 124
              result = path.read_text(errors="replace")
              print(result, end="", flush=True)
              with (evidence / "exit-status.log").open("a") as statuses:
                  statuses.write(f"{path.name}: {status}\n")
              return status, result

          failures = []
          for case in cases:
              full_name = "hypervisor::timer_probe::" + case
              status, listing = run(
                  [full_name, "--exact", "--list"], evidence / f"{case}-list.log", 5
              )
              if status or listing.splitlines().count(f"{full_name}: test") != 1:
                  failures.append(f"{case}: test absent or listing failed")
                  continue
              status, result = run(
                  [full_name, "--exact", "--nocapture", "--test-threads=1"],
                  evidence / f"{case}.log",
                  deadline,
              )
              # HVF's existing signed child and its parent each print a summary.
              counts = 1 if backend == "kvm" else 2
              if status or result.count("test result: ok. 1 passed; 0 failed; 0 ignored;") != counts:
                  failures.append(f"{case}: native execution failed or test count was unexpected")
          if failures:
              raise SystemExit("\n".join(failures))
          PY
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: arm-timer-${{ matrix.backend }}-${{ github.sha }}
          path: target/arm-timer-evidence
          if-no-files-found: error
