name: WHP fixed-state native RAM diagnostic
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-windows:
    runs-on: windows-2025
    timeout-minutes: 35
    env:
      CARGO_NET_GIT_FETCH_WITH_CLI: 'true'
      DILLO_WHP_EMULATION_TRACE: '1'
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Verify revision and host
        shell: pwsh
        run: |
          if ((git rev-parse HEAD) -ne $env:GITHUB_SHA) { throw 'Wrong checkout' }
          git rev-parse HEAD
          Get-CimInstance Win32_OperatingSystem | Select-Object Caption, Version, BuildNumber
          Get-CimInstance Win32_Processor | Select-Object Name, Manufacturer
          (Get-Item "$env:windir\System32\WinHvEmulation.dll").VersionInfo | Format-List FileVersion, ProductVersion
      - name: Install pinned compiler
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force .cargo | Out-Null
          Copy-Item .copr/cargo-config.toml .cargo/config.toml
          rustup toolchain install nightly-2026-07-06 --profile minimal --component rust-src
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          rustup target add --toolchain nightly-2026-07-06 x86_64-unknown-none
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: Swatinem/rust-cache@v2
      - name: Run exact bounded diagnostic
        shell: pwsh
        run: |
          $fixture = 'hypervisor::tests::whp_fixed_entry_emulation_diagnostic_matrix'
          New-Item -ItemType Directory -Force diagnostic-evidence | Out-Null
          cargo +nightly-2026-07-06 test --locked -p dillo-machine-whp --lib $fixture -- --list 2>&1 | Tee-Object diagnostic-evidence/list.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not (Select-String -Path diagnostic-evidence/list.log -SimpleMatch "$fixture`: test")) { throw 'Diagnostic fixture missing' }
          cargo +nightly-2026-07-06 test --locked -p dillo-machine-whp --lib $fixture -- --exact --nocapture --test-threads=1 2>&1 | Tee-Object diagnostic-evidence/native.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not (Select-String -Path diagnostic-evidence/native.log -SimpleMatch 'WHP entry experiment read-after-native-ram: EAX after exit=')) { throw 'Native prelude evidence missing' }
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: whp-fixed-state-native-ram
          path: diagnostic-evidence
