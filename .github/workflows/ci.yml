name: Current PMI Intel KVM mode admission
on:
  workflow_dispatch:
    inputs:
      revision:
        description: Exact production source SHA to qualify
        required: true
        type: string
permissions:
  contents: read
jobs:
  intel-mode:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      NIGHTLY: nightly-2026-07-06
      SOURCE_REVISION: ${{ inputs.revision }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.revision }}
      - name: Verify revision and isolated runner
        shell: bash
        env:
          QUALIFICATION_ENVIRONMENT: ${{ runner.environment }}
        run: |
          set -euo pipefail
          [[ "$SOURCE_REVISION" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$SOURCE_REVISION"
          test "$QUALIFICATION_ENVIRONMENT" = github-hosted
          mkdir -p target/mode-evidence .cargo
          cp .copr/cargo-config.toml .cargo/config.toml
          uname -a | tee target/mode-evidence/kernel.txt
          lscpu | tee target/mode-evidence/cpu.txt
          python3 - <<'PY'
          from pathlib import Path
          flags = Path('/proc/cpuinfo').read_text().split('flags', 1)[1].splitlines()[0].split()
          assert 'vmx' in flags and 'svm' not in flags, 'requires a VMX-only Intel runner'
          for name in ('ept', 'unrestricted_guest'):
              value = Path('/sys/module/kvm_intel/parameters', name).read_text().strip()
              assert value == 'Y', (name, value)
          PY
      - name: Install toolchain and tracing
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install "$NIGHTLY" --profile minimal --component rust-src
          rustup default "$NIGHTLY"
          rustup target add x86_64-unknown-none aarch64-unknown-none x86_64-unknown-linux-musl
          if ! command -v strace >/dev/null; then
            sudo -n apt-get update
            sudo -n apt-get install -y strace
          fi
      - uses: Swatinem/rust-cache@v2
      - name: Reserve RAM for native guest boots
        shell: bash
        run: |
          set -euo pipefail
          sudo -n sysctl -w vm.nr_hugepages=1024
          test "$(cat /proc/sys/vm/nr_hugepages)" -ge 1024
      - name: Build exact-source native fixtures
        id: build
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked -p dillo-machine-kvm --lib --no-run --message-format=json > target/build.jsonl
          mapfile -t binaries < <(jq -r 'select(.reason == "compiler-artifact" and .profile.test == true and .target.name == "dillo_machine_kvm") | .executable // empty' target/build.jsonl)
          test "${#binaries[@]}" -eq 1
          echo "test_binary=${binaries[0]}" >> "$GITHUB_OUTPUT"
      - name: Qualify native supported and disabled modes
        shell: bash
        env:
          TEST_BINARY: ${{ steps.build.outputs.test_binary }}
          QUALIFICATION_ENVIRONMENT: ${{ runner.environment }}
        run: |
          set -euo pipefail
          test "$QUALIFICATION_ENVIRONMENT" = github-hosted
          mode_dir=/sys/module/kvm_intel/parameters
          initial_ug=$(cat "$mode_dir/unrestricted_guest")
          initial_ept=$(cat "$mode_dir/ept")
          test "$initial_ug" = Y
          test "$initial_ept" = Y
          restore() {
            if test -d /sys/module/kvm_intel; then
              sudo -n modprobe -r kvm_intel || return
            fi
            sudo -n modprobe kvm_intel "unrestricted_guest=$initial_ug" "ept=$initial_ept"
          }
          qualify() {
            local label=$1 fixture=$2
            sudo -n chmod a+rw /dev/kvm
            printf 'unrestricted_guest=%s ept=%s\n' "$(cat "$mode_dir/unrestricted_guest")" "$(cat "$mode_dir/ept")" | tee "target/mode-evidence/$label.mode"
            timeout --kill-after=5s 45s strace -f -X raw -e trace=ioctl -o "target/mode-evidence/$label.trace" "$TEST_BINARY" --exact "$fixture" --include-ignored --nocapture 2>&1 | tee "target/mode-evidence/$label.log"
          }
          qualify supported notification::tests::guest_writes_match_address_width_and_queue_value
          sudo -n modprobe -r kvm_intel
          trap restore EXIT
          sudo -n modprobe kvm_intel unrestricted_guest=0 ept=1
          test "$(cat "$mode_dir/unrestricted_guest")" = N
          test "$(cat "$mode_dir/ept")" = Y
          qualify disabled hypervisor::backend_tests::rejects_restricted_intel_before_vm_create
          sudo -n modprobe -r kvm_intel
          sudo -n modprobe kvm_intel unrestricted_guest=1 ept=0
          test "$(cat "$mode_dir/unrestricted_guest")" = N
          test "$(cat "$mode_dir/ept")" = N
          qualify ept_disabled hypervisor::backend_tests::rejects_restricted_intel_before_vm_create
          restore
          trap - EXIT
          qualify restored notification::tests::guest_writes_match_address_width_and_queue_value
          python3 - <<'PY'
          import re
          from pathlib import Path
          root = Path('target/mode-evidence')
          for label in ('supported', 'restored', 'disabled', 'ept_disabled'):
              calls = {int(value, 16) for value in re.findall(r'ioctl\(\d+, (0x[0-9a-f]+)', (root / f'{label}.trace').read_text())}
              assert 0xae00 in calls, (label, 'KVM_GET_API_VERSION not observed')
              assert 0xae47 not in calls and 0x4008ae48 not in calls, (label, 'scratch ioctl observed')
              if label in ('disabled', 'ept_disabled'):
                  assert 0xae01 not in calls, (label, 'KVM_CREATE_VM observed before refusal')
              else:
                  assert {0xae01, 0xae41, 0xae80} <= calls, (label, 'native VM/vCPU/run proof missing')
              assert '1 passed' in (root / f'{label}.log').read_text(), (label, 'fixture did not execute')
          PY
      - name: Boot two fresh two-CPU Linux guests on Intel
        shell: bash
        run: |
          set -euo pipefail
          test "$(cat /sys/module/kvm_intel/parameters/unrestricted_guest)" = Y
          timeout --kill-after=10s 300s cargo test --locked -p dillo --features vm-tests --test boot cpus_2_2 -- --test-threads=1 --nocapture 2>&1 | tee target/mode-evidence/intel-boots.log
          python3 - <<'PYCODE'
          from pathlib import Path
          log = Path('target/mode-evidence/intel-boots.log').read_text()
          assert '2 passed; 0 failed; 0 ignored' in log, 'both native boot assertions must execute'
          assert 'skip: no usable' not in log, 'native KVM unavailable'
          PYCODE
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: intel-kvm-mode-evidence
          path: target/mode-evidence
          if-no-files-found: error
