name: Native CPU RNG investigation
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-rndr:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-arm64
            runners: '["self-hosted","Linux","ARM64","bare-metal","aarch64","kvm"]'
          - platform: macos-arm64
            runners: '["self-hosted","macOS","ARM64","bare-metal","m1"]'
    runs-on: ${{ fromJSON(matrix.runners) }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Inspect host and execute architectural RNG instructions
        shell: bash
        run: |
          set -euo pipefail
          ulimit -c 0
          mkdir -p rng-evidence
          {
            git rev-parse HEAD
            uname -a
            if [[ "$(uname -s)" == Darwin ]]; then
              sysctl machdep.cpu.brand_string
              sysctl hw.optional.arm.FEAT_RNG || true
              sdk=$(xcrun --show-sdk-path)
              grep -RniE 'rndr|rng|random|feature_reg|trap' "$sdk/System/Library/Frameworks/Hypervisor.framework/Headers" || true
              cc -Wall -Wextra -Werror scripts/native-rndr.c -framework Hypervisor -o rng-evidence/probe
            else
              cat /proc/cpuinfo
              cc -Wall -Wextra -Werror scripts/native-rndr.c -o rng-evidence/probe
            fi
            ./rng-evidence/probe
          } 2>&1 | tee rng-evidence/result.txt
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: native-rndr-${{ matrix.platform }}
          path: rng-evidence
          if-no-files-found: error
