name: Avrea Linux full tests
'on':
  push:
    branches:
    - probe/avrea-linux-tests
permissions:
  contents: read
env:
  CARGO_TERM_COLOR: always
  CARGO_NET_GIT_FETCH_WITH_CLI: 'true'
  NIGHTLY: nightly-2026-07-06
jobs:
  ci:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
        - name: avrea-x86
          runs_on: '["avrea-ubuntu-latest-4-vcpu"]'
          guest_musl: x86_64-unknown-linux-musl
        - name: avrea-arm
          runs_on: '["avrea-ubuntu-latest-arm-4-vcpu"]'
          guest_musl: aarch64-unknown-linux-musl
    runs-on: ${{ fromJSON(matrix.runs_on) }}
    timeout-minutes: 60
    steps:
    - uses: actions/checkout@v7.0.1
    - name: Install cargo config
      shell: bash
      run: mkdir -p .cargo && cp packaging/cargo-config.toml .cargo/config.toml
    - name: Install toolchain
      shell: bash
      run: 'rustup toolchain install "$NIGHTLY" --profile minimal --component rust-src

        rustup default "$NIGHTLY"

        # arma embeds native-arch tatu; snuffler is cross-built for the guest

        # musl triple matching this host''s arch.

        rustup target add x86_64-unknown-none aarch64-unknown-none "${{ matrix.guest_musl }}"

        '
    - uses: Swatinem/rust-cache@v2
      with:
        save-if: ${{ runner.environment == 'github-hosted' || github.ref == 'refs/heads/main' }}
    - name: Versions
      shell: bash
      run: 'cargo --version

        rustc --version

        '
    - name: Enable KVM (Linux)
      if: runner.os == 'Linux'
      run: 'uname -a

        lscpu

        free -h

        ls -l /dev/kvm

        sudo chmod 666 /dev/kvm

        test -r /dev/kvm && test -w /dev/kvm

        '
    - name: Test (Linux, full workspace)
      if: runner.os == 'Linux'
      shell: bash
      env:
        CARGO_BUILD_RUSTFLAGS: -D warnings
      run: cargo test --workspace
    - name: Reserve hugepages for guest RAM (Linux/KVM)
      if: runner.os == 'Linux'
      shell: bash
      run: "# Hosted runners start with a fragmented page allocator, so a single\n# `sysctl -w vm.nr_hugepages=4096` often only secures a fraction. Free\n# the page cache + compact memory and retry so enough 2 MiB-contiguous\n# regions become available. This is allocation flakiness, not a gap.\n# The explicit large-memory tests run one 8 GiB guest at a time.\nwant=4096\npages=$(sysctl -n vm.nr_hugepages)\nfor attempt in 1 2 3 4 5 6; do\n  if [ \"$pages\" -ge \"$want\" ]; then break; fi\n  sync || true\n  echo 3 | sudo tee /proc/sys/vm/drop_caches >/dev/null || true\n  echo 1 | sudo tee /proc/sys/vm/compact_memory >/dev/null || true\n  sudo sysctl -w vm.nr_hugepages=$want || true\n  pages=$(sysctl -n vm.nr_hugepages)\n  echo \"hugepage reservation attempt $attempt: nr_hugepages=$pages (want $want)\"\n  sleep 3\ndone\nif [ \"$pages\" -lt \"$want\" ]; then\n  echo \"Linux runner must provide vm.nr_hugepages >= $want; got $pages\" >&2\n  exit 1\nfi\ngrep -i huge /proc/meminfo\n"
    - name: Boot tests (KVM / WHP / HVF)
      shell: bash
      env:
        CARGO_BUILD_RUSTFLAGS: -D warnings
      run: cargo test -p dillo --features vm-tests -- --test-threads=1 --nocapture
    - name: Large-memory boots (Linux x86_64 / ARM64)
      if: runner.os == 'Linux'
      shell: bash
      env:
        CARGO_BUILD_RUSTFLAGS: -D warnings
        DILLO_MEMORY_EVIDENCE: target/memory-evidence
      run: cargo test -p dillo --features vm-tests --test boot boots_with_large_memory -- --ignored --test-threads=1 --nocapture
    - name: Upload large-memory boot evidence
      if: always() && runner.os == 'Linux'
      uses: actions/upload-artifact@v7.0.2
      with:
        name: memory-evidence-${{ matrix.name }}
        path: target/memory-evidence
