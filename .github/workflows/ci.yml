name: WHP CPUID mode observation
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  observe:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Exact source and native host
        shell: pwsh
        run: |
          if ((git rev-parse HEAD) -ne "${{ github.sha }}") { throw "wrong checkout" }
          Get-CimInstance Win32_Processor | Select-Object Name, Manufacturer
          Get-ComputerInfo | Select-Object WindowsProductName, OsBuildNumber, HyperVisorPresent
      - name: Native mode observation
        shell: bash
        env:
          CARGO_BUILD_RUSTFLAGS: -D warnings
        run: cargo test --locked -p dillo-machine-whp whp_cpuid_mode_observation -- --ignored --nocapture --test-threads=1
