name: Diagnostic Arm EL1 timer interrupts

on:
  push:
    branches: [diag/arm-timer-ppis]
  workflow_dispatch:

permissions:
  contents: read

env:
  NIGHTLY: nightly-2026-07-06
  CARGO_BUILD_RUSTFLAGS: -D warnings

jobs:
  native:
    if: github.ref == 'refs/heads/diag/arm-timer-ppis'
    name: Native ${{ matrix.backend }} timer probe
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - backend: kvm
            runners: '["self-hosted","Linux","ARM64","bare-metal","aarch64","kvm"]'
          - backend: hvf
            runners: '["self-hosted","macOS","ARM64","bare-metal","m1"]'
    runs-on: ${{ fromJSON(matrix.runners) }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Record exact source and native host
        shell: bash
        env:
          PROBE_BACKEND: ${{ matrix.backend }}
        run: |
          mkdir -p target/arm-timer-evidence
          {
            test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
            git rev-parse HEAD
            git status --short
            date -u +%FT%TZ
            uname -a
            if [[ "$PROBE_BACKEND" == kvm ]]; then
              test "$(uname -m)" = aarch64
              test -c /dev/kvm
              test -r /dev/kvm
              test -w /dev/kvm
              ls -l /dev/kvm
            else
              test "$(uname -m)" = arm64
              sw_vers
              sysctl -n machdep.cpu.brand_string
              test "$(sysctl -n kern.hv_support)" = 1
            fi
          } 2>&1 | tee target/arm-timer-evidence/host.log
      - name: Build only the focused native backend test binary
        shell: bash
        env:
          PROBE_CRATE: dillo-machine-${{ matrix.backend }}
        run: |
          rustup toolchain install "$NIGHTLY" --profile minimal
          rustc +"$NIGHTLY" -vV | tee target/arm-timer-evidence/rustc.log
          if ! cargo +"$NIGHTLY" --config .copr/cargo-config.toml test \
            --locked -p "$PROBE_CRATE" --lib --no-run --message-format=json \
            > target/arm-timer-evidence/build.jsonl \
            2> target/arm-timer-evidence/build.stderr; then
            cat target/arm-timer-evidence/build.stderr
            exit 1
          fi
      - name: Execute each exact probe with a process-group deadline
        uses: actions/github-script@v8
        env:
          PROBE_BACKEND: ${{ matrix.backend }}
        with:
          script: |
            const fs = require('node:fs');
            const { spawn } = require('node:child_process');
            const backend = process.env.PROBE_BACKEND;
            const evidence = 'target/arm-timer-evidence';
            const build = fs.readFileSync(`${evidence}/build.jsonl`, 'utf8')
              .trim().split('\n').map(JSON.parse);
            const binaries = build.filter(event =>
              event.reason === 'compiler-artifact' &&
              event.target.name === `dillo_machine_${backend}` &&
              event.profile.test && event.executable
            ).map(event => event.executable);
            if (binaries.length !== 1) throw new Error(`Expected one native test binary: ${binaries}`);
            const [binary] = binaries;
            const cases = backend === 'kvm' ? ['native_kvm_relocated_el1_timer_ppis'] :
              ['native_hvf_el1_physical_timer', 'native_hvf_el1_virtual_timer'];
            const deadline = backend === 'kvm' ? 20 : 70;

            async function run(args, name, seconds) {
              core.info(`deadline=${seconds}s command=${JSON.stringify([binary, ...args])}`);
              const path = `${evidence}/${name}`;
              const fd = fs.openSync(path, 'w');
              const child = spawn(binary, args, { stdio: ['ignore', fd, fd], detached: true });
              fs.closeSync(fd);
              const status = await new Promise((resolve, reject) => {
                let expired = false;
                let reap;
                const timer = setTimeout(() => {
                  expired = true;
                  fs.appendFileSync(path, '\nTIMEOUT: killing native process group\n');
                  try { process.kill(-child.pid, 'SIGKILL'); }
                  catch (error) { if (error.code !== 'ESRCH') core.error(error.message); }
                  reap = setTimeout(() => {
                    child.unref();
                    reject(new Error('Native process did not exit after group kill'));
                  }, 5000);
                }, seconds * 1000);
                child.once('error', error => {
                  clearTimeout(timer);
                  fs.appendFileSync(path, `\nLAUNCH ERROR: ${error.message}\n`);
                  resolve(127);
                });
                child.once('close', (code, signal) => {
                  clearTimeout(timer);
                  clearTimeout(reap);
                  core.info(`native exit code=${code} signal=${signal}`);
                  resolve(expired ? 124 : (code ?? 128));
                });
              });
              const output = fs.readFileSync(path, 'utf8');
              core.info(output);
              fs.appendFileSync(`${evidence}/exit-status.log`, `${name}: ${status}\n`);
              return { status, output };
            }

            const failures = [];
            for (const name of cases) {
              const fullName = `hypervisor::timer_probe::${name}`;
              const listing = await run([fullName, '--exact', '--list'], `${name}-list.log`, 5);
              if (listing.status || listing.output.split(/\r?\n/)
                    .filter(line => line === `${fullName}: test`).length !== 1) {
                failures.push(`${name}: test absent or listing failed`);
                continue;
              }
              const result = await run(
                [fullName, '--exact', '--nocapture', '--test-threads=1'], `${name}.log`, deadline);
              // HVF's signed child and its parent each print a summary.
              const expected = backend === 'kvm' ? 1 : 2;
              const summaries = result.output.match(/test result: ok\. 1 passed; 0 failed; 0 ignored;/g) || [];
              if (result.status || summaries.length !== expected)
                failures.push(`${name}: native execution failed or test count was unexpected`);
            }
            if (failures.length) core.setFailed(failures.join('\n'));
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: arm-timer-${{ matrix.backend }}-${{ github.sha }}
          path: target/arm-timer-evidence
          if-no-files-found: error
