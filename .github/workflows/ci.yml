name: CI

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_NET_GIT_FETCH_WITH_CLI: "true"
  CARGO_BUILD_RUSTFLAGS: "-D warnings"
  RUSTUP_TOOLCHAIN: nightly-2026-07-06
  BASELINE_SHA: 338b6e470a9fa3c001ae4699085f72b85c9a2226
  CANDIDATE_SHA: 3cc39aa59390f221415921044daea3e9d36d6d36

jobs:
  named-console-ab:
    name: Named console A/B (macOS ARM64)
    runs-on: [self-hosted, macOS, ARM64, bare-metal, m1]
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Install the CI toolchain
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal --component rust-src
          rustup target add aarch64-unknown-none-softfloat aarch64-unknown-linux-musl
          rustup show active-toolchain
          rustup target list --installed

      - name: Compare five native boots per revision
        shell: bash
        run: |
          set -euo pipefail
          export EVIDENCE="$GITHUB_WORKSPACE/target/named-console-evidence"
          export TRIAL_ROOT
          TRIAL_ROOT="$(mktemp -d "$RUNNER_TEMP/named-console-ab.XXXXXX")"
          export BURROW_CACHE="$TRIAL_ROOT/kernel-cache"
          mkdir -p "$EVIDENCE"

          cleanup() {
            for variant in baseline candidate; do
              git worktree remove --force "$TRIAL_ROOT/$variant" 2>/dev/null || true
            done
            rm -rf -- "$TRIAL_ROOT"
          }
          trap cleanup EXIT

          {
            printf 'runner=%s\n' "$RUNNER_NAME"
            uname -a
            sw_vers
            rustc -vV
            git rev-parse HEAD
          } | tee "$EVIDENCE/provenance.txt"

          git diff "$CANDIDATE_SHA" HEAD -- tests/boot/main.rs > "$EVIDENCE/capture.patch"
          test -s "$EVIDENCE/capture.patch"
          for variant in baseline candidate; do
            case "$variant" in
              baseline) revision="$BASELINE_SHA" ;;
              candidate) revision="$CANDIDATE_SHA" ;;
            esac
            tree="$TRIAL_ROOT/$variant"
            git worktree add --detach "$tree" "$revision"
            git -C "$tree" apply "$EVIDENCE/capture.patch"
            printf '%s source=%s\n' "$variant" "$(git -C "$tree" rev-parse HEAD)" |
              tee -a "$EVIDENCE/provenance.txt"
            (
              cd "$tree"
              export CARGO_TARGET_DIR="$TRIAL_ROOT/$variant-target"
              cargo --config .copr/cargo-config.toml test --locked -p dillo \
                --features vm-tests --test boot --no-run --message-format=json
            ) > "$EVIDENCE/$variant-build.json"
          done

          python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          import signal
          import subprocess

          evidence = Path(os.environ["EVIDENCE"])
          trial_root = Path(os.environ["TRIAL_ROOT"])
          artifacts = {}
          for variant in ("baseline", "candidate"):
              build_log = evidence / f"{variant}-build.json"
              with build_log.open() as lines:
                  events = [json.loads(line) for line in lines]
              paths = {
                  event["target"]["name"]: Path(event["executable"])
                  for event in events
                  if event["reason"] == "compiler-artifact"
                  and event.get("executable")
                  and (
                      (event["target"]["name"] == "boot" and event["profile"]["test"])
                      or (event["target"]["name"] == "dillo" and not event["profile"]["test"])
                  )
              }
              artifacts[variant] = paths
              with (evidence / "provenance.txt").open("a") as log:
                  for name in ("boot", "dillo"):
                      binary = paths[name]
                      digest = hashlib.sha256(binary.read_bytes()).hexdigest()
                      line = f"{variant} {name} compiled_sha256={digest} path={binary}"
                      print(line, flush=True)
                      print(line, file=log)

          results = []
          for pair in range(1, 6):
              order = ("baseline", "candidate") if pair % 2 else ("candidate", "baseline")
              for variant in order:
                  output = evidence / f"{pair:02d}-{variant}"
                  output.mkdir()
                  binary = artifacts[variant]["boot"]
                  argv = [str(binary), "--exact", "boots_with_named_console_ports",
                          "--test-threads=1", "--nocapture"]
                  env = {**os.environ, "DILLO_NAMED_CONSOLE_EVIDENCE": str(output)}
                  with (output / "test.log").open("wb") as log:
                      process = subprocess.Popen(
                          argv, cwd=trial_root / variant, env=env,
                          stdout=log, stderr=subprocess.STDOUT, start_new_session=True,
                      )
                      try:
                          code = process.wait(timeout=140)
                      except subprocess.TimeoutExpired:
                          try:
                              os.killpg(process.pid, signal.SIGKILL)
                          except ProcessLookupError:
                              pass
                          process.wait()
                          code = 124

                  console = output / "console.out"
                  raw = console.read_bytes() if console.exists() else b""
                  status = output / "vm-status.txt"
                  named_tx = output / "named-tx.raw"
                  pmi_hash = output / "pmi-sha256.txt"
                  artifacts_complete = all(path.exists() for path in (
                      status, named_tx, console, output / "console.err", pmi_hash,
                  ))
                  signed = hashlib.sha256(artifacts[variant]["dillo"].read_bytes()).hexdigest()
                  summary = {
                      "pair": pair, "revision": variant, "test_exit": code,
                      "captured": artifacts_complete,
                      "vm_status": status.read_text().strip() if status.exists() else None,
                      "console_bytes": len(raw), "console_valid_utf8": raw.decode("utf-8", "replace").encode() == raw,
                      "report_start": raw.count(b"<<<DILLO-E2E-REPORT>>>"),
                      "report_end": raw.count(b"<<<END>>>"),
                      "named_tx_hex": named_tx.read_bytes().hex() if named_tx.exists() else None,
                      "pmi_sha256": pmi_hash.read_text().strip() if pmi_hash.exists() else None,
                      "signed_dillo_sha256": signed,
                  }
                  results.append(summary)
                  print(json.dumps(summary), flush=True)

          (evidence / "results.json").write_text(json.dumps(results, indent=2) + "\n")
          raise SystemExit(int(any(row["test_exit"] or not row["captured"] for row in results)))
          PY

      - name: Upload raw named-console evidence
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: named-console-hvf-ab
          path: target/named-console-evidence
