name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A newer push to the same pull request or branch cancels the older run.
# Each run on main gets its own group, so runs on main are never
# cancelled or dropped while waiting.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref == 'refs/heads/main' && github.run_id || github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_NET_GIT_FETCH_WITH_CLI: "true"
  NIGHTLY: nightly-2026-07-06

# dillo needs nightly: it consumes arma as a `-Z bindeps` artifact dependency
# (which cross-builds tatu for a bare-metal target) and snuffler as a musl
# artifact. See the pichi-vm split checklist's toolchain carve-out.
jobs:
  license-headers:
    name: license headers
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: korandoru/hawkeye@v6

  cargo-deny:
    name: cargo-deny
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Install cargo config
        shell: bash
        run: mkdir -p .cargo && cp packaging/cargo-config.toml .cargo/config.toml
      # artifact deps make `cargo metadata` nightly-only, so install the pinned
      # toolchain (from rust-toolchain.toml) before cargo-deny reads the tree.
      - run: rustup show
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check

  commit-messages:
    name: commit messages
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - name: Check commit messages
        env:
          PR_BASE: ${{ github.base_ref }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          if [ -n "$PR_BASE" ]; then
            commit_range="origin/$PR_BASE..HEAD"
          elif [ -n "$PUSH_BEFORE" ] && [ "$PUSH_BEFORE" != "0000000000000000000000000000000000000000" ] &&
               git cat-file -e "$PUSH_BEFORE^{commit}" 2>/dev/null &&
               git merge-base --is-ancestor "$PUSH_BEFORE" HEAD; then
            commit_range="$PUSH_BEFORE..HEAD"
          else
            git fetch --no-tags origin main:refs/remotes/origin/main
            commit_range="origin/main..HEAD"
            if [ "$(git rev-list --count "$commit_range")" -eq 0 ]; then
              echo "No new commits to check"
              exit 0
            fi
          fi
          pipx run gitlint --commits "$commit_range"

  lint:
    name: fmt + clippy
    runs-on: ubuntu-24.04
    env:
      RUSTFLAGS: -D warnings
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Install cargo config
        shell: bash
        run: mkdir -p .cargo && cp packaging/cargo-config.toml .cargo/config.toml
      - name: Install toolchain
        shell: bash
        run: |
          rustup toolchain install "$NIGHTLY" --profile minimal --component rustfmt,clippy,rust-src
          rustup default "$NIGHTLY"
          # arma embeds native-arch tatu (bare-metal); snuffler cross-builds for
          # the x86_64 guest musl triple on this x86_64 lint host.
          rustup target add x86_64-unknown-none aarch64-unknown-none x86_64-unknown-linux-musl

      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --all-features
      - run: cargo clippy --manifest-path fuzz/Cargo.toml --all-targets --all-features

  # Independent of the OS matrix: packaging-only flakes must not burn
  # those runners. Copr runs this Makefile as root with dnf; here we
  # install the same tools via apt + rustup and pass DNF=true so the
  # recipe skips dnf on Ubuntu.
  copr-srpm:
    name: copr srpm
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Install rpmbuild tools
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm xz-utils gzip
      - name: Install pinned Rust toolchain
        run: rustup show
      - name: Build SRPM
        run: |
          set -euo pipefail
          outdir=$(mktemp -d)
          make -f .copr/Makefile srpm \
            spec="$PWD/packaging/dillo.spec" \
            outdir="$outdir" \
            DNF=true
          shopt -s nullglob
          srpms=("$outdir"/*.src.rpm)
          test "${#srpms[@]}" -eq 1
          case "${srpms[0]}" in
            */dillo-vm-*.src.rpm) ;;
            *) echo "SRPM package name must be dillo-vm, got ${srpms[0]}" >&2; exit 1 ;;
          esac
          echo "built ${srpms[0]}"
          test ! -e vendor

  # Real same-arch guest boot on every supported platform. dillo builds its
  # per-OS backend (KVM on Linux, WHP on Windows, HVF on macOS) and boots an
  # Alpine guest; the boot suite asserts the guest's self-report. The plain
  # workspace test run precedes it (Windows/macOS exclude the Unix/Linux-only
  # crates, matching dillo's own cfg gating).
  #
  # Tier 2 of the fail-fast DAG. The cheap checks above run in parallel on
  # every push and pull request. This matrix starts only after all of them
  # succeed, so a red license, deny, gitlint, or lint job does not spend
  # KVM, WHP, or HVF minutes.
  ci:
    name: ${{ matrix.name }}
    needs:
      - license-headers
      - cargo-deny
      - commit-messages
      - lint
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: ubuntu-24.04      # Linux x86_64 - full workspace + real KVM boot
            os: ubuntu-24.04
            runs_on: '["ubuntu-24.04"]'
            guest_musl: x86_64-unknown-linux-musl
          - name: linux-arm64       # Linux arm64 - full workspace + real KVM boot
            os: linux-arm64
            runs_on: '["self-hosted","Linux","ARM64","bare-metal","aarch64","kvm"]'
            guest_musl: aarch64-unknown-linux-musl
          - name: windows-2025      # Windows x86_64 - build + real WHP boot
            os: windows-2025
            runs_on: '["windows-2025"]'
            guest_musl: x86_64-unknown-linux-musl
          - name: macos-arm64       # macOS arm64 - build + real HVF boot
            os: macos-arm64
            runs_on: '["self-hosted","macOS","ARM64","bare-metal","m1"]'
            guest_musl: aarch64-unknown-linux-musl
    runs-on: ${{ fromJSON(matrix.runs_on) }}
    # There is only one macOS runner, so a stuck macOS test must not hold it
    # for hours. A normal macOS job takes 2 to 7 minutes.
    timeout-minutes: ${{ matrix.os == 'macos-arm64' && 15 || 60 }}
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Install cargo config
        shell: bash
        run: mkdir -p .cargo && cp packaging/cargo-config.toml .cargo/config.toml

      - name: Install toolchain
        shell: bash
        run: |
          rustup toolchain install "$NIGHTLY" --profile minimal --component rust-src
          rustup default "$NIGHTLY"
          # arma embeds native-arch tatu; snuffler is cross-built for the guest
          # musl triple matching this host's arch.
          rustup target add x86_64-unknown-none aarch64-unknown-none "${{ matrix.guest_musl }}"

      - uses: Swatinem/rust-cache@v2

      - name: Versions
        shell: bash
        run: |
          cargo --version
          rustc --version

      - name: Enable KVM (Linux)
        if: runner.os == 'Linux'
        run: ls -l /dev/kvm && sudo chmod 666 /dev/kvm || true

      - name: Test (Linux x86_64, full workspace)
        if: matrix.os == 'ubuntu-24.04'
        shell: bash
        env:
          CARGO_BUILD_RUSTFLAGS: "-D warnings"
        run: cargo test --workspace

      - name: Test (Windows, workspace minus Unix-only crates)
        if: runner.os == 'Windows'
        shell: bash
        env:
          CARGO_BUILD_RUSTFLAGS: "-D warnings"
        run: |
          # dillo-virtio-vsock bridges vsock to host Unix sockets (UnixStream),
          # so it is Unix-only; dillo depends on it via cfg(unix) and never
          # builds it on Windows. snuffler is the Linux guest probe.
          cargo test --workspace --exclude snuffler --exclude dillo-virtio-vsock

      - name: Reserve hugepages for guest RAM (Linux/KVM)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          # Hosted runners start with a fragmented page allocator, so a single
          # `sysctl -w vm.nr_hugepages=4096` often only secures a fraction. Free
          # the page cache + compact memory and retry so enough 2 MiB-contiguous
          # regions become available. This is allocation flakiness, not a gap.
          # The explicit large-memory tests run one 8 GiB guest at a time.
          want=4096
          pages=$(sysctl -n vm.nr_hugepages)
          for attempt in 1 2 3 4 5 6; do
            if [ "$pages" -ge "$want" ]; then break; fi
            sync || true
            echo 3 | sudo tee /proc/sys/vm/drop_caches >/dev/null || true
            echo 1 | sudo tee /proc/sys/vm/compact_memory >/dev/null || true
            sudo sysctl -w vm.nr_hugepages=$want || true
            pages=$(sysctl -n vm.nr_hugepages)
            echo "hugepage reservation attempt $attempt: nr_hugepages=$pages (want $want)"
            sleep 3
          done
          if [ "$pages" -lt "$want" ]; then
            echo "Linux runner must provide vm.nr_hugepages >= $want; got $pages" >&2
            exit 1
          fi
          grep -i huge /proc/meminfo

      - name: Boot tests (KVM / WHP / HVF)
        shell: bash
        env:
          CARGO_BUILD_RUSTFLAGS: "-D warnings"
        run: cargo test -p dillo --features vm-tests -- --test-threads=1 --nocapture

      - name: Large-memory boots (Linux x86_64 / ARM64)
        if: runner.os == 'Linux'
        shell: bash
        env:
          CARGO_BUILD_RUSTFLAGS: "-D warnings"
          DILLO_MEMORY_EVIDENCE: target/memory-evidence
        run: >-
          cargo test -p dillo --features vm-tests --test boot
          boots_with_large_memory -- --ignored --test-threads=1 --nocapture

      - name: Upload large-memory boot evidence
        if: always() && runner.os == 'Linux'
        uses: actions/upload-artifact@v7.0.2
        with:
          name: memory-evidence-${{ matrix.name }}
          path: target/memory-evidence

  workspace:
    name: workspace tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04-arm, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Install cargo config
        shell: bash
        run: mkdir -p .cargo && cp packaging/cargo-config.toml .cargo/config.toml
      - name: Install toolchain
        shell: bash
        run: |
          rustup toolchain install "$NIGHTLY" --profile minimal --component rust-src
          rustup default "$NIGHTLY"
          rustup target add x86_64-unknown-none aarch64-unknown-none aarch64-unknown-linux-musl
      - uses: Swatinem/rust-cache@v2
      - name: Test (Linux, full workspace)
        if: runner.os == 'Linux'
        shell: bash
        env:
          CARGO_BUILD_RUSTFLAGS: "-D warnings"
        run: cargo test --workspace

      - name: Test (macOS, workspace minus Linux-only crates)
        if: runner.os == 'macOS'
        shell: bash
        env:
          CARGO_BUILD_RUSTFLAGS: "-D warnings"
        run: cargo test --workspace --exclude snuffler
