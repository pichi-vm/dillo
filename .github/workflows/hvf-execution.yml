name: HVF execution probe

on:
  push:
    branches: [milestone/isolated-block]
    paths:
      - .github/scripts/hvf_memory_probe.py
      - .github/workflows/hvf-execution.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: [self-hosted, macOS, ARM64, bare-metal, m1, self-managed-seatbelt]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Identify native host
        run: sw_vers
      - name: Compare native RAM mappings
        run: python3 .github/scripts/hvf_memory_probe.py
