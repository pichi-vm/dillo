name: Windows resource transfer probe

on:
  push:
    branches: [milestone/vhost-user-windows-binding]
  workflow_dispatch:

concurrency:
  group: windows-rpc-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rpc:
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Native RPC resource ownership
        shell: pwsh
        run: ./probes/windows-rpc/run.ps1
      - name: Install Rust
        shell: pwsh
        run: rustup toolchain install nightly-2026-07-06 --profile minimal
      - uses: Swatinem/rust-cache@v2
      - name: Windows channel library
        run: cargo +nightly-2026-07-06 test --locked -p dillo-windows-channel -- --nocapture
      - name: Retain probe evidence
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: windows-rpc
          path: |
            target/windows-rpc
            target/debug/build/dillo-windows-channel-*/out/wire*.h
            target/debug/build/dillo-windows-channel-*/out/wire*.c
