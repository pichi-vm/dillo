name: Native console lifetime qualification
on:
  push:
    branches: [feat/madrillo-console-lifetime]
  workflow_dispatch:
jobs:
  console:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure artifact dependencies
        shell: bash
        run: mkdir -p .cargo && cp packaging/cargo-config.toml .cargo/config.toml
      - name: Native console pipe tests (no VM conformance claim)
        run: |
          cargo test -p dillo-virtio-console --lib -- --nocapture
