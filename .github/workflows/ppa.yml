name: PPA source

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ppa-source
  cancel-in-progress: true

jobs:
  source:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: main
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - name: Publish source and request builds
        env:
          LAUNCHPAD_AUTHORIZATION: ${{ secrets.LAUNCHPAD_AUTHORIZATION }}
        run: |
          mkdir -p .cargo
          RUSTC_BOOTSTRAP=1 cargo +stable --config packaging/cargo-config.toml vendor --locked --versioned-dirs vendor > .cargo/vendor.toml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f .cargo/vendor.toml vendor
          git commit -m 'build: prepare PPA source'
          token=$(curl -fsS -X POST \
            https://api.launchpad.net/devel/~nmccallum/pichi-vm/+git/dillo-ppa \
            -d ws.op=issueAccessToken \
            -H "Authorization: $LAUNCHPAD_AUTHORIZATION, oauth_timestamp=\"$(date +%s)\", oauth_nonce=\"$RANDOM\"" | jq -er .)
          echo "::add-mask::$token"
          basic=$(printf 'nmccallum:%s' "$token" | base64 -w0)
          echo "::add-mask::$basic"
          git -c "http.extraHeader=Authorization: Basic $basic" push --force \
            https://git.launchpad.net/~nmccallum/pichi-vm/+git/dillo-ppa HEAD:refs/heads/build/ppa
          curl -fsS -X POST https://api.launchpad.net/devel/~nmccallum/+recipe/dillo \
            -d ws.op=performDailyBuild \
            -H "Authorization: $LAUNCHPAD_AUTHORIZATION, oauth_timestamp=\"$(date +%s)\", oauth_nonce=\"$RANDOM\""
