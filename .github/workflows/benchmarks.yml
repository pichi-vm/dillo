name: Shared MMIO status experiment

on:
  workflow_dispatch:
    inputs:
      platform:
        description: Select a platform or run the full matrix
        type: choice
        options: [all, linux-x86, linux-arm, macos-arm, windows-msvc]
        default: all
      cases:
        description: Workload selection
        type: choice
        options: [all, pci-free, block-pci, block-mmio, block4-pci, block4-concurrent-pci, net-pci, block-mmio-only, net-mmio-only]
        default: all
      pairs:
        description: Measured pairs after the retained warm-up
        type: number
        default: 10
      duration_ms:
        description: Duration of each measured operation
        type: number
        default: 5000
      queue_depth:
        description: Maximum concurrent block requests per device
        type: choice
        options: ["1", "8", "32"]
        default: "1"
      sampling:
        description: Compare instrumentation on the same host
        type: choice
        options: ["on", "off", both]
        default: "on"
      kernel:
        description: Existing fixture or prebuilt Hyper-V clock diagnostic (x86 block only)
        type: choice
        options: [fixture, wsl-clock]
        default: fixture

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_NET_GIT_FETCH_WITH_CLI: "true"
  NIGHTLY: nightly-2026-07-06

jobs:
  paired:
    strategy:
      fail-fast: false
      matrix:
        platform: ${{ fromJSON(inputs.platform != 'all' && format('["{0}"]', inputs.platform) || '["linux-x86","linux-arm","macos-arm","windows-msvc"]') }}
    name: ${{ matrix.platform }} paired measurements
    runs-on: ${{ fromJSON(matrix.platform == 'linux-arm' && '["self-hosted","Linux","ARM64","bare-metal","aarch64","kvm"]' || matrix.platform == 'macos-arm' && '["self-hosted","macOS","ARM64","bare-metal","m1","self-managed-seatbelt"]' || matrix.platform == 'windows-msvc' && '["windows-2025"]' || '["ubuntu-24.04"]') }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Use the writable job temporary directory
        shell: bash
        run: |
          echo "TMPDIR=$RUNNER_TEMP" >> "$GITHUB_ENV"
          echo "BENCH_RESULTS=$RUNNER_TEMP/dillo-benchmark-results-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" >> "$GITHUB_ENV"
      - uses: actions/setup-python@v6
        if: runner.environment == 'github-hosted'
        with:
          python-version: '3.12'
      - name: Install measurement tools
        shell: bash
        run: |
          if ! command -v python3 >/dev/null; then
            bench_python=$(nix build --no-link --print-out-paths nixpkgs#python312)
            export PATH="$bench_python/bin:$PATH"
          fi
          python3 -m venv "$RUNNER_TEMP/dillo-bench-python"
          if [ "$RUNNER_OS" = Windows ]; then
            bench_bin="$RUNNER_TEMP/dillo-bench-python/Scripts"
          else
            bench_bin="$RUNNER_TEMP/dillo-bench-python/bin"
          fi
          "$bench_bin/python" -m pip install psutil==7.2.2
          echo "$bench_bin" >> "$GITHUB_PATH"
      - name: Install toolchain
        shell: bash
        run: |
          rustup toolchain install "$NIGHTLY" --profile minimal --component rust-src
          rustup default "$NIGHTLY"
          rustup target add x86_64-unknown-none aarch64-unknown-none "${{ contains(matrix.platform, 'arm') && 'aarch64-unknown-linux-musl' || 'x86_64-unknown-linux-musl' }}"
          if [ "$RUNNER_OS" = Windows ]; then
            echo 'CARGO_BUILD_TARGET=x86_64-pc-windows-msvc' >> "$GITHUB_ENV"
          fi
      - uses: Swatinem/rust-cache@master
        with:
          save-if: ${{ runner.environment == 'github-hosted' }}
      - name: Provide native KVM RAM
        if: runner.os == 'Linux'
        shell: bash
        run: |
          if ! test -r /dev/kvm || ! test -w /dev/kvm; then
            sudo chmod 666 /dev/kvm
          fi
          if [ "$(awk '/HugePages_Free/{print $2}' /proc/meminfo)" -lt 128 ]; then
            sudo sysctl -w vm.nr_hugepages=256
          fi
          test "$(awk '/HugePages_Free/{print $2}' /proc/meminfo)" -ge 128
      - name: Check native wired completion lifecycle
        if: runner.os == 'Linux'
        shell: bash
        run: >-
          cargo --config .copr/cargo-config.toml test --locked
          -p dillo-machine-kvm wired_completion::tests -- --nocapture
      - name: Check native WHP completion lifecycle
        if: runner.os == 'Windows'
        shell: bash
        run: >-
          cargo --config .copr/cargo-config.toml test --locked
          -p dillo-machine-whp whp_trigger_ -- --nocapture
      - name: Build matched release assets
        shell: bash
        env:
          DILLO_BENCH_DIR: ${{ github.workspace }}/target/benchmarks
        run: >-
          cargo --config .copr/cargo-config.toml test --locked --release
          -p dillo --features vm-tests,bench-in-process --test boot
          benchmark::benchmark_assets -- --ignored --exact --nocapture
      - name: Select the prebuilt clock diagnostic kernel
        if: inputs.kernel == 'wsl-clock'
        shell: bash
        env:
          BENCH_CASES: ${{ inputs.cases }}
        run: >-
          python benchmarks/wsl_kernel.py target/benchmarks/assets.json
          --cache "$RUNNER_TEMP/dillo-wsl-kernel" --cases "$BENCH_CASES"
      - name: Measure paired workloads
        shell: bash
        env:
          BENCH_CASES: ${{ inputs.cases == 'pci-free' && 'block-mmio-only,net-mmio-only' || inputs.cases != 'all' && inputs.cases || 'block-pci,block-mmio,block4-pci,block4-concurrent-pci,net-pci,block-mmio-only,net-mmio-only' }}
          BENCH_SAMPLING: ${{ inputs.sampling || 'on' }}
          BENCH_PAIRS: ${{ inputs.pairs || 10 }}
          BENCH_DURATION_MS: ${{ inputs.duration_ms || 5000 }}
          BENCH_QUEUE_DEPTH: ${{ inputs.queue_depth || 1 }}
          BENCH_KERNEL: ${{ inputs.kernel }}
        run: |
          bench_modes="$BENCH_SAMPLING"
          if [ "$bench_modes" = both ]; then bench_modes='on off'; fi
          for bench_latch in relay shared; do
          unset DILLO_BENCH_SHARED_ISR
          if [ "$bench_latch" = shared ]; then export DILLO_BENCH_SHARED_ISR=1; fi
          for bench_mode in $bench_modes; do
            bench_options=()
            if [ "$bench_mode" = off ]; then bench_options+=(--no-sample); fi
            if [ "$BENCH_KERNEL" = wsl-clock ]; then bench_options+=(--serial); fi
            python benchmarks/run.py --assets target/benchmarks/assets.json \
              --output "$BENCH_RESULTS/$bench_latch/$bench_mode" --pairs "$BENCH_PAIRS" \
              --duration-ms "$BENCH_DURATION_MS" --queue-depth "$BENCH_QUEUE_DEPTH" \
              --cases "$BENCH_CASES" "${bench_options[@]}"
          done
          done
      - name: Upload measurements and logs
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: device-benchmarks-${{ matrix.platform }}
          path: |
            ${{ env.BENCH_RESULTS }}/**/*.json
            ${{ env.BENCH_RESULTS }}/**/*.txt
          if-no-files-found: warn
