name: Worker platform probe

on:
  push:
    branches: [milestone/isolated-block]
  workflow_dispatch:
    inputs:
      runner:
        type: choice
        options: [windows-2025, macos-15, macos-26]
        default: windows-2025
      network:
        description: Probe direct host networking inside confinement
        type: boolean
        default: false
      socket_broker:
        description: Probe a socket granted by the parent
        type: boolean
        default: false

jobs:
  worker:
    runs-on: ${{ inputs.runner || 'windows-2025' }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Install toolchain
        shell: bash
        run: rustup toolchain install nightly-2026-07-06 --profile minimal --component rust-src
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --locked -p dillo-worker -p dillo-machine-unix
      - if: runner.os == 'Windows'
        run: cargo test --locked -p dillo-machine-whp worker::vhost_user
      - if: inputs.network
        run: cargo test --locked -p dillo-worker --test device_process -- --network-probe
      - if: inputs.socket_broker
        run: cargo test --locked -p dillo-worker --test device_process -- --socket-probe
