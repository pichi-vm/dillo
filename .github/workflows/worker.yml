name: Worker platform probe

on:
  push:
    branches: [milestone/isolated-block]
  workflow_dispatch:
    inputs:
      runner:
        type: choice
        options: [windows-2025, macos-15, macos-26]
        default: windows-2025
      network:
        description: Probe direct host networking inside confinement
        type: boolean
        default: false
      socket_broker:
        description: Probe a socket granted by the parent
        type: boolean
        default: false
      vmnet:
        description: Exercise privileged native vmnet inside the confined worker
        type: boolean
        default: false
      native_notifications:
        description: Qualify WHP doorbell and interrupt trigger behavior
        type: boolean
        default: false

jobs:
  worker:
    runs-on: ${{ inputs.runner || 'windows-2025' }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Install toolchain
        shell: bash
        run: rustup toolchain install nightly-2026-07-06 --profile minimal --component rust-src
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --locked -p dillo-worker -p dillo-machine-unix -p dillo-virtio-net
      - if: runner.os == 'Windows'
        run: cargo test --locked -p dillo-machine-whp worker::vhost_user
      - if: inputs.native_notifications && runner.os == 'Windows'
        run: |
          cargo test --locked -p dillo-machine-whp whp_trigger_retargets_and_revokes_exported_event
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --locked -p dillo-machine-whp whp_doorbell_matches_and_unregisters
      - if: inputs.network
        run: cargo test --locked -p dillo-worker --test device_process -- --network-probe
      - if: inputs.socket_broker
        run: cargo test --locked -p dillo-worker --test device_process -- --socket-probe
      - if: inputs.vmnet && runner.os == 'macOS'
        shell: bash
        run: |
          test_bin=$(cargo test --locked -p dillo-worker --test device_process --no-run --message-format=json | python3 -c 'import sys,json; print(next(x["executable"] for x in map(json.loads,sys.stdin) if x.get("executable")))')
          interface=$(route -n get default | awk '/interface:/{print $2}')
          sudo "$test_bin" --vmnet-probe "$interface"
