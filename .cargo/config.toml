# Artifact dependencies build helper programs used by the test suite.
[unstable]
bindeps = true

# Link the Linux guest probe as a static executable on either host platform.
[target.x86_64-unknown-linux-musl]
rustflags = ["-C", "relocation-model=static", "-C", "linker=rust-lld"]

[target.aarch64-unknown-linux-musl]
rustflags = ["-C", "relocation-model=static", "-C", "linker=rust-lld"]
