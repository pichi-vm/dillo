[package]
name = "dillo-machine-whp"
version = "0.1.0"
edition.workspace = true
publish.workspace = true
license.workspace = true
description = "WHP machine backend crate for dillo."

[dependencies]
dillo-devtree.workspace = true
dillo-machine.workspace = true
dillo-mmio.workspace = true
pmi.workspace = true
vm-memory.workspace = true
log.workspace = true
thiserror.workspace = true

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { workspace = true, features = [
    "Win32_System_Memory", "Win32_Security", "Win32_Security_Isolation",
    "Win32_Security_Authorization", "Win32_System_Threading", "Win32_System_JobObjects",
    "Win32_Storage_FileSystem", "Win32_System_Console", "Win32_System_WindowsProgramming",
    "Win32_System_Pipes", "Win32_System_IO",
] }
tempfile.workspace = true
uuid.workspace = true

[target.'cfg(target_os = "windows")'.dev-dependencies]
windows-sys = { workspace = true, features = ["Win32_System_Memory"] }

[lints]
workspace = true
