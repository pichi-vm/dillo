[package]
name = "dillo-machine-whp"
version = "0.1.0"
edition.workspace = true
publish.workspace = true
license.workspace = true
description = "WHP machine backend crate for dillo."

[dependencies]
dillo-devtree.workspace = true
dillo-machine.workspace = true
dillo-mmio.workspace = true
pmi.workspace = true
vm-memory.workspace = true
log.workspace = true
thiserror.workspace = true

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys.workspace = true

[target.'cfg(target_os = "windows")'.dev-dependencies]
windows-sys = { workspace = true, features = ["Win32_System_Memory"] }
wait-timeout = "0.2"

[dev-dependencies]
dillo-virtio = { workspace = true, features = ["test-support"] }
dillo-runtime.workspace = true

[lints]
workspace = true
