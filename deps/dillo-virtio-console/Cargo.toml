[package]
name = "dillo-virtio-console"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true
description = "virtio-console device implementing dillo_virtio::VirtioDevice. Drives hvc0 to stdout."

[dependencies]
dillo-config.workspace = true
interprocess = "=2.4.7"
dillo-mmio.workspace = true
dillo-virtio.workspace = true
vm-memory.workspace = true
log.workspace = true
thiserror.workspace = true

# Named-port host backends are inherited pipe ends. Unix adopts a file
# descriptor (nix: dup + O_NONBLOCK on our own copy); Windows adopts a handle
# (DuplicateHandle + PeekNamedPipe-before-ReadFile). Both stay behind
# `cfg(unix)` / `cfg(windows)` so the portable core builds everywhere.
[target.'cfg(unix)'.dependencies]
nix = { workspace = true, features = ["user"] }

[target.'cfg(windows)'.dependencies]
win-custody = "=0.1.2"
widestring = "1"
windows-sys = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_Pipes",
    "Win32_System_Threading",
] }

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
