[package]
name = "dillo-worker"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true
description = "Parent virtio backend proxy and child lifecycle protocol."

[dependencies]
dillo-ipc.workspace = true
dillo-machine.workspace = true
dillo-mmio.workspace = true
dillo-virtio.workspace = true
vm-memory.workspace = true
serde.workspace = true
serde_json.workspace = true
log.workspace = true

[[test]]
name = "device_process"
path = "tests/device_process.rs"
harness = false

[dev-dependencies]
dillo-pci.workspace = true
dillo-pci-virtio.workspace = true
dillo-virtio-blk.workspace = true
dillo-virtio-console.workspace = true
dillo-virtio-fs.workspace = true
dillo-virtio-net.workspace = true
dillo-virtio-vsock.workspace = true
dillo-storage.workspace = true
imago.workspace = true
tempfile.workspace = true

[target.'cfg(unix)'.dev-dependencies]
dillo-machine-unix.workspace = true
nix = { workspace = true, features = ["event"] }

[target.'cfg(target_os = "linux")'.dev-dependencies]
dillo-machine-kvm.workspace = true

[target.'cfg(target_os = "macos")'.dev-dependencies]
dillo-machine-hvf.workspace = true

[target.'cfg(target_os = "windows")'.dev-dependencies]
dillo-machine-whp.workspace = true
windows-sys = { workspace = true, features = [
    "Win32_System_Memory", "Win32_Security", "Win32_Networking_WinSock", "Win32_System_Pipes",
] }

[lints]
workspace = true
