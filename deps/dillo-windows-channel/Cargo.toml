[package]
name = "dillo-windows-channel"
version = "0.1.0"
edition.workspace = true
publish.workspace = true
license.workspace = true
description = "Local Windows messages with kernel-mediated resource transfer."

[target.'cfg(windows)'.dependencies]
uuid.workspace = true
windows-sys = { workspace = true, features = [
    "Win32_Security", "Win32_System_Threading", "Win32_System_Memory",
    "Win32_System_Diagnostics_Debug",
] }

[build-dependencies]
cc = "1"

[lints]
workspace = true
