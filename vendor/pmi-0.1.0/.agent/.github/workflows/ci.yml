name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  commit-messages:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive
      - run: pipx run gitlint --commits "origin/${{ github.base_ref || 'main' }}..HEAD"
