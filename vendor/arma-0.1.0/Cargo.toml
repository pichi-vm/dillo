[dependencies]
anyhow = "1"
ciborium = "0.2"
flate2 = "1"
ruzstd = "0.9.1"
thiserror = "2"
vm-fdt = "0.3"

[dependencies.clap]
version = "4"
features = ["derive"]

[dependencies.devtree]
version = "0.1"
git = "https://github.com/pichi-vm/devtree"
features = ["alloc"]

[dependencies.goblin]
version = "0.10"
features = [
    "elf32",
    "elf64",
    "pe64",
    "alloc",
    "endian_fd",
    "std",
]
default-features = false

[dependencies.pmi]
version = "0.1"
git = "https://github.com/pichi-vm/pmi"

[dependencies.regex]
version = "1"
features = [
    "std",
    "perf",
]
default-features = false

[dependencies.zerocopy]
version = "0.8"
features = ["derive"]

[dev-dependencies]
rstest = "0.28"
sha2 = "0.11"
tempfile = "3"

[dev-dependencies.burrow]
version = "0.1"
git = "https://github.com/pichi-vm/burrow"

[target.'cfg(target_arch = "aarch64")'.dependencies.tatu]
path = "deps/tatu"
artifact = ["bin"]
target = "aarch64-unknown-none"

[target.'cfg(target_arch = "x86_64")'.dependencies.tatu]
