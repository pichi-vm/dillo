# cargo-deny for arma (+ bundled tatu/dtb2acpi/dtb2e820). License allowlist
# tailored to the actual dependency tree (cargo metadata).

[licenses]
allow = [
    "Apache-2.0", "MIT", "Unicode-3.0",
    "BSD-3-Clause", "Zlib",
]
confidence-threshold = 0.8

[advisories]
version = 2
ignore = []

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true   # workspace-internal path deps (tatu, dtb2*)

[sources]
unknown-registry = "deny"
unknown-git = "deny"
[sources.allow-org]
github = ["pichi-vm"]   # pmi / devtree / burrow git deps
